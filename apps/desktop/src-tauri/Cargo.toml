[package]
name = "hubbub-desktop"
version.workspace = true
edition.workspace = true
description = "Hubbub Desktop — Personal Multi-Agent Chat App"
rust-version = "1.97"

[lib]
name = "hubbub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.7"

[dependencies]
hubbub-app = { path = "../../../crates/app" }
hubbub-domain = { path = "../../../crates/domain" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri = "2.12"
tauri-plugin-log = "2"
tracing = { workspace = true }
log = "0.4"
